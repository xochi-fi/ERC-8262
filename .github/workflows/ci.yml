name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci
  NARGO_VERSION: 1.0.0-beta.20
  BB_VERSION: 4.0.0-nightly.20260120
  # .gas-snapshot is version-sensitive: floating `stable` broke `forge snapshot --check`.
  FOUNDRY_VERSION: v1.5.1

jobs:
  solidity:
    name: Solidity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Check formatting
        run: forge fmt --check

      - name: EIP draft <-> src/interfaces drift check
        run: python3 scripts/eip-interface-drift.py .

      - name: Build contracts
        run: |
          forge build --sizes 2>&1 | tee /tmp/sizes.txt || true
          # Check our contracts stay under 24KB (generated UltraHonk verifiers excluded --
          # they are ~24.6KB by design and deploy with linked libraries)
          if grep -E '^\|' /tmp/sizes.txt \
            | grep -v 'AttestationVerifier\|ComplianceVerifier\|MembershipVerifier\|NonMembershipVerifier\|PatternVerifier\|RiskScoreVerifier' \
            | grep -v 'CommitmentSchemeLib\|FrLib\|TranscriptLib\|EcLib\|UltraLib\|RelationsLib' \
            | awk -F'|' '{gsub(/[ ,]/,"",$4); if ($4+0 < 0) { print "OVER LIMIT: "$0; found=1}} END {exit (found ? 0 : 1)}'; then
            echo "::error::Contract exceeds 24KB size limit"
            exit 1
          fi
          echo "All non-generated contracts within 24KB limit"

      - name: Run tests
        run: forge test -vvv

      - name: Check gas snapshot
        run: FOUNDRY_PROFILE=default forge snapshot --check --tolerance 2 --no-match-contract InvariantTest --no-match-test "testFuzz_"

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Move generated verifiers
        run: mv src/generated /tmp/generated-backup

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          fail-on: high
          slither-args: --filter-paths "test/,script/,lib/"

      - name: Restore generated verifiers
        if: always()
        run: mv /tmp/generated-backup src/generated

  circuits:
    name: Noir Circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache nargo
        uses: actions/cache@v4
        with:
          path: ~/.nargo
          key: nargo-${{ env.NARGO_VERSION }}

      - name: Install nargo
        uses: ./.github/actions/install-nargo
        with:
          version: ${{ env.NARGO_VERSION }}

      - name: Run circuit tests
        run: cd circuits && nargo test --workspace

      - name: Compile circuits for parity check
        run: cd circuits && nargo compile --workspace

      - name: Circuit <-> Solidity public-input parity (audit F-8)
        run: python3 scripts/parity-check.py .

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    needs: [solidity, circuits]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install nargo
        uses: ./.github/actions/install-nargo
        with:
          version: ${{ env.NARGO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile circuits
        run: cd circuits && nargo compile --workspace

      - name: Build contracts
        run: forge build

      - name: Run SDK tests
        run: npm run test:sdk

  # Lockstep gate for public-input layout changes (ERC-8262#33). The SDK pinned in
  # .xochi-sdk-ref must prove the circuits in this tree and submit to these
  # contracts; a PR that changes a circuit's public inputs bumps the pin to the
  # xochi-sdk commit that matches it, so neither repo can land the change alone.
  xochi-sdk:
    name: xochi-sdk cross-repo
    runs-on: ubuntu-latest
    needs: [solidity, circuits]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned xochi-sdk ref
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < .xochi-sdk-ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout xochi-sdk
        uses: actions/checkout@v4
        with:
          repository: xochi-fi/xochi-sdk
          ref: ${{ steps.pin.outputs.ref }}
          path: xochi-sdk

      # package.json resolves @xochi/sdk from file:../xochi-sdk/packages/sdk.
      - name: Place xochi-sdk as a sibling checkout
        run: mv xochi-sdk ../xochi-sdk

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install nargo
        uses: ./.github/actions/install-nargo
        with:
          version: ${{ env.NARGO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build @xochi/sdk
        working-directory: ../xochi-sdk
        run: |
          npm ci
          npm run build -w @xochi/sdk

      - name: Install dependencies
        run: npm ci

      - name: Compile circuits
        run: cd circuits && nargo compile --workspace

      - name: Build contracts
        run: forge build

      - name: Run cross-repo SDK tests
        run: make test-xochi-sdk
